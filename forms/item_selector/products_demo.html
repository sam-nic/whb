<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Отбор изделий</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1a2233; --muted:#6b7686;
    --line:#e4e8f0; --accent:#3a6df0; --accent-ink:#fff;
    --ok:#1f9d55; --okbg:#e8f7ee; --err:#d64545; --errbg:#fdecec;
    --chip:#eef2fb; --field:#f7f9fd;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#12151c; --card:#1b1f28; --ink:#e8ecf3; --muted:#98a2b3;
      --line:#2a303c; --accent:#5b86f5; --chip:#232936; --field:#232936;
      --okbg:#12281c; --errbg:#2a1717;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; align-items:stretch; justify-content:center; padding:0;
  }
  .card{
    background:var(--card); width:100%; max-width:none; min-height:100vh;
    border:none; border-radius:0; box-shadow:none; overflow:hidden;
    display:flex; flex-direction:column;
  }
  header{padding:18px 20px 12px}
  h1{font-size:18px; margin:0 0 4px}
  .sub{color:var(--muted); font-size:13px; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .badge{font-size:11px; padding:2px 8px; border-radius:20px; background:var(--chip); color:var(--muted); font-weight:600}
  .badge.live{background:var(--okbg); color:var(--ok)}
  .badge.demo{background:#fff4e0; color:#b9770a}
  .badge.src{background:#eef0ff; color:#5b57d6}
  @media (prefers-color-scheme: dark){ .badge.demo{background:#2b2410; color:#e6b84d} .badge.src{background:#221f3d; color:#a9a4ff} }
  .head-row{display:flex; gap:44px; align-items:center; flex-wrap:wrap}
  .titlebox{flex:0 0 auto}
  .ms{display:flex; flex-direction:column; gap:3px; flex:1 1 240px; min-width:0; position:relative}
  .ms > label{font-size:12px; color:var(--muted)}
  .ms-btn{padding:9px 10px; border-radius:9px; border:1px solid var(--line); background:var(--field); color:var(--ink);
    font-size:13px; width:100%; text-align:left; cursor:pointer; display:flex; justify-content:space-between; gap:8px; align-items:center}
  .ms-btn.on{border-color:var(--accent)}
  .ms-btn .cap{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .ms-btn .arw{flex:none; color:var(--muted); font-size:11px}
  .ms-pop{position:absolute; top:100%; left:0; right:0; z-index:20; margin-top:4px; max-height:320px; overflow:auto;
    background:var(--card); border:1px solid var(--line); border-radius:10px; box-shadow:0 12px 34px rgba(20,30,60,.18); padding:6px}
  .ms-pop.hidden{display:none}
  .ms-opt{display:flex; gap:10px; align-items:center; padding:8px; border-radius:8px; cursor:pointer; font-size:13px}
  .ms-opt:hover{background:var(--chip)}
  .ms-opt input{width:17px;height:17px;accent-color:var(--accent);flex:none;cursor:pointer}
  .ms-head{display:flex; justify-content:flex-end; padding:2px 4px 6px; border-bottom:1px solid var(--line); margin-bottom:4px; position:sticky; top:0; background:var(--card)}
  .ms-reset{background:none; border:none; color:var(--accent); cursor:pointer; font-size:12px; padding:2px 4px}
  .chips{display:flex; flex-wrap:wrap; gap:6px; padding:6px 20px 0}
  .chip{display:inline-flex; align-items:center; gap:4px; background:var(--chip); border:1px solid var(--line); border-radius:20px; padding:3px 4px 3px 11px; font-size:12px}
  .chip .ck{opacity:.6; margin-right:2px}
  .chip .cv{font-weight:600}
  .chip button{background:none; border:none; color:var(--muted); cursor:pointer; font-size:15px; line-height:1; padding:0 5px; border-radius:50%}
  .chip button:hover{color:var(--err)}
  .chips-reset{align-self:center; margin-left:6px}
  .toolbar{display:flex; align-items:center; gap:14px; padding:8px 20px 4px}
  .link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13px;padding:4px 0;white-space:nowrap}
  .link.danger{color:var(--err)}
  .count{font-size:13px; color:var(--muted); margin-left:auto; text-align:right}
  .count b{color:var(--ink); font-variant-numeric:tabular-nums}
  .toolbar .hint{font-size:12px; color:var(--muted); opacity:.8}
  .colhead{display:flex; align-items:center; gap:12px; padding:2px 22px 4px; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.02em}
  .colhead .sp{flex:1 1 auto}
  .colhead .h-sklad{flex:none; width:70px; text-align:right}
  .colhead .h-ship{flex:none; width:104px; text-align:right}
  ul.list{list-style:none; margin:0; padding:4px 10px 10px; flex:1 1 auto; min-height:0; overflow:auto}
  li.row{display:flex; gap:12px; align-items:center; padding:9px 12px; border-radius:10px; cursor:pointer}
  li.row:hover{background:var(--chip)}
  li.row.sel{background:var(--chip)}
  li.row .chk{width:19px;height:19px;accent-color:var(--accent);flex:none;pointer-events:none}
  li.row .t{flex:1; min-width:0}
  li.row .nm{display:block}
  li.row .meta{font-size:12px; color:var(--muted); margin-top:2px}
  li.row .qty{flex:none; width:70px; text-align:right; font-weight:700; font-variant-numeric:tabular-nums}
  li.row .ship{flex:none; width:104px}
  li.row .ship input{width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:8px;
    background:var(--field); color:var(--ink); font-size:14px; text-align:right; font-variant-numeric:tabular-nums}
  li.row .ship input::-webkit-inner-spin-button{margin-left:6px}
  li.row .ship input.bad{border-color:var(--err); color:var(--err); background:var(--errbg)}
  li.group{display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:10px 12px; margin:10px 0 2px; cursor:pointer; border-radius:8px;
    background:var(--chip); font-weight:700; user-select:none}
  li.group:first-child{margin-top:2px}
  li.group:hover{background:var(--accent); color:#fff}
  li.group .gcount{flex:none; font-weight:500; font-size:12px; color:var(--muted)}
  li.group:hover .gcount{color:#e6ecff}
  .state{padding:36px 20px; text-align:center; color:var(--muted)}
  footer{padding:14px 20px 20px; border-top:1px solid var(--line)}
  button.go{
    width:100%; border:none; border-radius:12px; padding:14px;
    background:var(--accent); color:var(--accent-ink); font-size:16px; font-weight:600; cursor:pointer;
  }
  button.go:disabled{opacity:.45; cursor:not-allowed}
  button.go:active:not(:disabled){transform:scale(.99)}
  .msg{padding:12px 14px; border-radius:10px; margin:0 20px 16px; font-size:13px; display:none}
  .msg.ok{display:block; background:var(--okbg); color:var(--ok)}
  .msg.err{display:block; background:var(--errbg); color:var(--err)}
  .msg.warn{display:block; background:#fff4e0; color:#b9770a}
  @media (prefers-color-scheme: dark){ .msg.warn{background:#2b2410; color:#e6b84d} }
  .perf{padding:4px 20px 0; font-size:11px; color:var(--muted)}
  .done{text-align:center; padding:40px 24px}
  .done .ic{font-size:44px}
  .done h2{margin:12px 0 6px; font-size:20px}
  .done p{color:var(--muted); margin:0}
</style>
</head>
<body>
<div class="card" id="app">
  <header>
    <div class="head-row">
      <div class="titlebox">
        <h1>Отбор изделий</h1>
        <div class="sub">
          <span id="taskLabel">Задача: —</span>
          <span class="badge" id="modeBadge">…</span>
          <span class="badge src" id="verBadge"></span>
        </div>
      </div>
      <div class="ms" id="msDeal" style="display:none">
        <label>Сделка</label>
        <button type="button" class="ms-btn"><span class="cap">Все</span><span class="arw">▼</span></button>
        <div class="ms-pop hidden"></div>
      </div>
    </div>
  </header>

  <div class="chips" id="chips" style="display:none"></div>

  <div class="toolbar" id="toolbar" style="display:none">
    <button class="link" id="toggleAll">Выбрать все</button>
    <button class="link danger" id="clearAll" style="display:none">Очистить все</button>
    <span class="hint">Shift — выбрать диапазон</span>
    <span class="count" id="counter">Выбрано: 0</span>
  </div>

  <div class="colhead" id="colhead" style="display:none">
    <span class="sp"></span>
    <span class="h-sklad">Доступно</span>
    <span class="h-ship">Отгружаем</span>
  </div>

  <ul class="list" id="list"></ul>
  <div class="state" id="state">Загрузка изделий…</div>
  <div class="perf" id="perf"></div>

  <div class="msg" id="msg"></div>

  <footer>
    <button class="go" id="go" disabled>Готово</button>
  </footer>
</div>

<script>
/* ============================================================
   НАСТРОЙКИ
   ============================================================ */
const APP_VERSION = "2.0.0 · 09.10.2026";

const CONFIG = {
  BASE:  "https://whb.planfix.ru/rest",

  // тикет об ошибке — как задача «Тикет себе» (#23): проект «Внедрение Planfix WHB», группа «Planfix интегратор»
  TICKET_PROJECT_ID: 18,
  TICKET_GROUP_ID:   17674,
  TOKEN: "b26ef8c845d7a959e8c1149aa7f9a1ad",

  MOVE_DATATAG_ID: 4054,   // аналитика "Движение"
  // поля аналитики 4054:
  F_MESTO: 18012,   // Место (Directory entry, справочник 7116)
  F_POST:  18014,   // Поступило (Number)
  F_BRON:  18008,   // Бронь (Number)
  F_DEAL:  18006,   // Сделка (Task)

  STORE_DIRECTORY_ID: 7116,   // справочник "Места хранений" — только для резолва названия места в id

  WRITE_DATATAG_ID: 4040,   // аналитика "Отгружаемые изделия" (записываем сюда по «Готово»)
  DT_ITEM_TASK: 18098,      // "Изделие (задача)" — Task-поле, пишем id задачи-изделия напрямую (справочник 7090 не нужен)
  DT_SHIPPED:   17832,      // "Отгружено" (Number)
  DT_DEAL:      18100       // "Сделка" — Task-поле, пишем id сделки; для строк «Без сделки» не заполняем
};

/* ============================================================
   ЛОГИКА
   ============================================================ */
const $ = id => document.getElementById(id);
const qs = new URLSearchParams(location.search);
const taskId = qs.get("task") || qs.get("taskId") || qs.get("id") || "";
const forcedStore = qs.get("store") || "";   // id ИЛИ название места хранения — обязателен для этого источника

$("taskLabel").textContent = taskId ? ("Задача №" + taskId) : "Задача не указана в URL";
const liveReady = !!(CONFIG.TOKEN && taskId);
$("modeBadge").textContent = liveReady ? "LIVE" : "ДЕМО";
$("modeBadge").className = "badge " + (liveReady ? "live" : "demo");
$("verBadge").textContent = "v" + APP_VERSION;

const api = (path, body) => fetch(CONFIG.BASE + path, {
  method: "POST",
  headers: { "Authorization": "Bearer " + CONFIG.TOKEN, "Content-Type": "application/json" },
  body: JSON.stringify(body)
}).then(r => r.json());
const apiGET = (path) => fetch(CONFIG.BASE + path, {
  headers: { "Authorization": "Bearer " + CONFIG.TOKEN }
}).then(r => r.json());

const cf = (entry, fid) => (entry.customFieldData.find(c => c.field.id === fid) || {});
const shipValid = x => Number.isFinite(x._ship) && x._ship > 0 && x._ship <= x.qty;
const esc = s => String(s == null ? "" : s).replace(/[<>&]/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;" }[c]));
// "Доска пола 23х185х3000 0с Черн. → 6 бр. + 2 св. = 8 шт." -> "Доска пола 23х185х3000 0с Черн."
const cleanName = s => String(s || "").split("→")[0].trim();

// Ошибка -> тикет по образцу «Тикет себе». Сбой самого тикета не должен маскировать исходную ошибку.
async function reportError(where, err){
  try{
    const d = new Date(), p = n => String(n).padStart(2, "0");
    const stamp = `${p(d.getDate())}.${p(d.getMonth()+1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
    const taskUrl = taskId ? "https://whb.planfix.ru/task/" + taskId : "";
    const description =
      "<b>Log ошибок</b><br>" +
      (taskUrl ? `Задача: <a href="${taskUrl}">${taskUrl}</a><br>` : "Задача: не указана в URL<br>") +
      "Где: " + esc(where) + "<br>" +
      "Ошибка: " + esc(err && err.message ? err.message : String(err)) + "<br>" +
      "Версия: " + esc(APP_VERSION) + "<br>" +
      "URL формы: " + esc(location.href);
    await api("/task/", {
      name: "Ошибка отбора " + stamp,
      description,
      project:   { id: CONFIG.TICKET_PROJECT_ID },
      assignees: { groups: [{ id: CONFIG.TICKET_GROUP_ID }] }
    });
  }catch(e){ console.warn("reportError failed", e); }
}

// разбор имени задачи-перемещения: "Перемещение 98 Цех 2 → Цех 4 | 26-06-2026"
function parseMove(name){
  name = String(name || "");
  const m = name.match(/Перемещени[ея]\s*№?\s*(\d+)/i);
  let route = name.split("|")[0];
  if (m) route = route.slice(route.indexOf(m[0]) + m[0].length);
  const a = route.split(/→|->|—›|›/);
  return { num: m ? m[1] : "", from: (a[0] || "").trim(), to: (a[1] || "").trim() };
}
function setHeader(name){
  const p = parseMove(name);
  if (!p.num && !p.from && !p.to) return;
  if (p.num) document.querySelector("header h1").innerHTML = "Перемещение №<b>" + esc(p.num) + "</b>";
  if (p.from || p.to) $("taskLabel").innerHTML = "из <b>" + esc(p.from) + "</b> в <b>" + esc(p.to) + "</b>";
}

let ITEMS = [];              // { key, taskId, name, qty, _ship, _sel, dealId, dealName }
let existingEntryKeys = [];  // ключи уже добавленных на задачу записей 4040 (для затирания по «Готово»)

// уже добавленная на задачу аналитика 4040 → пред-отметка изделий и значения «Отгружаем».
// Матчим по taskId напрямую через поле 18098 (Task) — справочник 7090 для этого не нужен.
async function loadExistingRaw(){
  if (!liveReady) return { taskName: "", rows: [] };
  const d = await apiGET(`/task/${encodeURIComponent(taskId)}?fields=id,name,dataTags`);
  const dtRows = (((d.task || {}).dataTags) || [])
    .filter(r => (r.dataTag || {}).id === CONFIG.WRITE_DATATAG_ID && r.key);
  existingEntryKeys = dtRows.map(r => r.key);
  const entries = await Promise.all(dtRows.map(r =>
    apiGET(`/datatag/entry/${r.key}?fields=${CONFIG.DT_ITEM_TASK},${CONFIG.DT_SHIPPED},${CONFIG.DT_DEAL}`)
  ));
  const rows = [];   // { taskId, dealId ("none" если пусто), ship }
  entries.forEach(e => {
    const fields = ((e.entry || {}).customFieldData) || [];
    const taskVal = (fields.find(c => c.field.id === CONFIG.DT_ITEM_TASK) || {}).value;
    const dealVal = (fields.find(c => c.field.id === CONFIG.DT_DEAL)      || {}).value;
    const shipVal = (fields.find(c => c.field.id === CONFIG.DT_SHIPPED)   || {}).value;
    if (!taskVal || !taskVal.id) return;
    rows.push({ taskId: taskVal.id, dealId: dealVal && dealVal.id ? String(dealVal.id) : "none", ship: Number(shipVal || 0) });
  });
  return { taskName: (d.task || {}).name, rows };
}

// ?store= — id или название места. Для API-фильтра (type 3105) нужен числовой id справочника 7116.
async function resolveLocationId(store){
  if (!store) return null;
  if (/^\d+$/.test(store)) return Number(store);
  // название вместо id — ищем в справочнике мест (7116, ~5 записей, дёшево)
  const d = await api(`/directory/${CONFIG.STORE_DIRECTORY_ID}/entry/list`, {
    offset: 0, pageSize: 100, fields: "key,18884"
  });
  const norm = s => String(s || "").trim().toLowerCase();
  const rows = d.directoryEntries || [];
  const hit = rows.find(e => norm(cf(e, 18884).value) === norm(store));
  return hit ? hit.key : null;
}

// Читаем записи "Движения" (4054), отфильтрованные СЕРВЕРНО по месту (type 3105).
// Пагинация растущими параллельными пачками — не зависит от текущего объёма данных:
// если очередной круг оказался полным, следующий круг вдвое больше (до потолка), это
// сходится за O(log N) кругов запросов, а не за N/100 последовательных обращений.
async function loadMovementForLocation(locationId){
  // pageSize у Planfix жёстко ограничен 100 (сервер отклоняет больше).
  // Замерено на этом инстансе: конкурентность ~8 запросов — устойчивый оптимум
  // (~1.2с независимо от их числа внутри круга); 12-16 параллельно — УЖЕ медленнее
  // (сервер сам, судя по всему, ограничивает параллелизм — упираться в это бессмысленно).
  // Поэтому не растим пачку экспоненциально «в бесконечность» — держим круг на 8 и,
  // если данных больше, просто делаем ещё один круг (столько кругов, сколько нужно,
  // без каких-либо предположений об объёме — это и даёт устойчивость к росту в сотни раз).
  const PAGE = 100, BATCH = 8;
  let offset = 0;
  const out = [];
  const filters = [{ type: 3105, field: CONFIG.F_MESTO, operator: "equal", value: locationId }];
  while (true){
    const offsets = Array.from({ length: BATCH }, (_, i) => offset + i * PAGE);
    const pages = await Promise.all(offsets.map(off =>
      api(`/datatag/${CONFIG.MOVE_DATATAG_ID}/entry/list`, {
        offset: off, pageSize: PAGE, filters,
        fields: `key,task,${CONFIG.F_POST},${CONFIG.F_BRON},${CONFIG.F_DEAL}`
      })
    ));
    pages.forEach(d => { if (d.result !== "success") throw new Error(d.error || "ошибка чтения аналитики"); });
    const rowsPerPage = pages.map(d => d.dataTagEntries || []);
    rowsPerPage.forEach(rows => out.push(...rows));
    offset += BATCH * PAGE;
    if (rowsPerPage[rowsPerPage.length - 1].length < PAGE) break;   // последняя страница круга неполная — дальше пусто
  }
  return out;
}

// Записи движения -> список для отбора: по каждой (задаче-изделию × сделке) — доступное количество.
// "Без сделки" — единая группа на всех изделий (это НЕ подставная сделка, а буквально "не забронировано").
function aggregate(entries){
  const products = new Map();   // taskId -> { name, received, reservedByDeal: Map<dealKeyOrNone,{name,qty}> }
  entries.forEach(e => {
    const task = e.task; if (!task) return;
    const post = Number(cf(e, CONFIG.F_POST).value || 0);
    const bron = Number(cf(e, CONFIG.F_BRON).value || 0);
    const deal = cf(e, CONFIG.F_DEAL).value;

    let p = products.get(task.id);
    if (!p){ p = { name: cleanName(task.name) || ("Изделие без названия (задача #" + task.id + ")"), received: 0, reservedByDeal: new Map() }; products.set(task.id, p); }
    p.received += post;
    if (bron){
      const dealKey = deal ? String(deal.id) : "none";
      const dealName = deal ? deal.name : "Без сделки";
      const cur = p.reservedByDeal.get(dealKey) || { name: dealName, qty: 0 };
      cur.qty += bron;
      p.reservedByDeal.set(dealKey, cur);
    }
  });

  const rows = [];
  products.forEach((p, taskId) => {
    let totalReserved = 0;
    p.reservedByDeal.forEach((d, dealKey) => {
      totalReserved += d.qty;
      if (d.qty > 0) rows.push({
        key: taskId + ":" + dealKey, taskId, name: p.name, qty: d.qty, _ship: d.qty,
        dealId: dealKey, dealName: d.name
      });
    });
    const free = p.received - totalReserved;
    if (free > 0) rows.push({
      key: taskId + ":none", taskId, name: p.name, qty: free, _ship: free,
      dealId: "none", dealName: "Без сделки"
    });
  });
  return rows;
}

/* ---- фильтр по сделкам (мультивыбор) — не рефетчит, только сужает уже загруженный список ---- */
const FSEL = new Set();
let dealNames = new Map();
const msDeal = () => $("msDeal");
const shownItems = () => ITEMS.filter(x => !FSEL.size || FSEL.has(String(x.dealId)));

function closePop(){ const p = msDeal().querySelector(".ms-pop"); if (p) p.classList.add("hidden"); }

function updateCap(){
  const cap = msDeal().querySelector(".cap"), btn = msDeal().querySelector(".ms-btn");
  if (!FSEL.size) cap.textContent = "Все";
  else if (FSEL.size === 1) cap.textContent = dealNames.get([...FSEL][0]) || "1 выбрана";
  else cap.textContent = "Сделок: " + FSEL.size;
  btn.classList.toggle("on", FSEL.size > 0);
}

function buildDealFilter(pairs){
  const btn = msDeal().querySelector(".ms-btn");
  const pop = msDeal().querySelector(".ms-pop");
  const seen = new Map();
  pairs.forEach(({id, name}) => { const s = String(id); if (!seen.has(s)) seen.set(s, name); });
  dealNames = seen;
  const entries = [...seen.entries()].sort((a,b) => {
    if (a[0] === "none") return 1; if (b[0] === "none") return -1;   // «Без сделки» — в конец списка
    return String(a[1]).localeCompare(String(b[1]), 'ru');
  });
  pop.innerHTML = "";
  const head = document.createElement("div"); head.className = "ms-head";
  head.innerHTML = '<button type="button" class="ms-reset">Сбросить</button>';
  head.querySelector(".ms-reset").addEventListener("click", (e) => {
    e.stopPropagation(); FSEL.clear();
    pop.querySelectorAll(".ms-opt input").forEach(b => b.checked = false);
    updateCap(); render();
  });
  pop.appendChild(head);
  entries.forEach(([id, name]) => {
    const o = document.createElement("label"); o.className = "ms-opt"; o.dataset.id = id;
    o.innerHTML = '<input type="checkbox"><span></span>';
    o.querySelector("span").textContent = name;
    const box = o.querySelector("input");
    box.checked = FSEL.has(id);
    box.addEventListener("change", () => {
      if (box.checked) FSEL.add(id); else FSEL.delete(id);
      updateCap(); render();
    });
    pop.appendChild(o);
  });
  btn.onclick = (e) => { e.stopPropagation(); const willOpen = pop.classList.contains("hidden"); closePop(); if (willOpen) pop.classList.remove("hidden"); };
  pop.onclick = (e) => e.stopPropagation();
  updateCap();
}

function renderChips(){
  const box = $("chips"); box.innerHTML = "";
  FSEL.forEach(id => {
    const chip = document.createElement("span"); chip.className = "chip";
    chip.innerHTML = '<span class="ck">Сделка:</span><span class="cv"></span><button title="Убрать">×</button>';
    chip.querySelector(".cv").textContent = dealNames.get(id) || id;
    chip.querySelector("button").addEventListener("click", () => {
      FSEL.delete(id);
      const opt = [...msDeal().querySelectorAll(".ms-opt")].find(o => o.dataset.id === id);
      if (opt) opt.querySelector("input").checked = false;
      updateCap(); render();
    });
    box.appendChild(chip);
  });
  if (FSEL.size){
    const rb = document.createElement("button");
    rb.className = "link chips-reset"; rb.textContent = "Сбросить всё";
    rb.addEventListener("click", () => {
      FSEL.clear(); msDeal().querySelectorAll(".ms-opt input").forEach(b => b.checked = false);
      updateCap(); render();
    });
    box.appendChild(rb);
  }
  box.style.display = FSEL.size ? "flex" : "none";
}

document.addEventListener("click", () => closePop());

let RENDER_ORDER = [];   // плоский порядок строк на экране — для Shift-диапазона
let lastClicked = null;  // последняя строка, по которой кликнули (якорь для Shift)

function render(){
  const list = $("list"); list.innerHTML = "";
  const shown = shownItems();
  RENDER_ORDER = [];

  const groups = []; const byKey = new Map();
  shown.forEach(x => {
    const key = String(x.dealId);
    let g = byKey.get(key);
    if (!g){ g = { key, name: x.dealName, items: [] }; byKey.set(key, g); groups.push(g); }
    g.items.push(x);
  });
  groups.sort((a,b) => a.key === "none" ? 1 : b.key === "none" ? -1 : 0);

  groups.forEach(g => {
    const head = document.createElement("li");
    head.className = "group";
    head.title = "Выбрать всю группу";
    head.innerHTML = '<span class="gname"></span><span class="gcount"></span>';
    head.querySelector(".gname").textContent = g.name;
    const gQty = g.items.reduce((s, i) => s + (Number(i.qty) || 0), 0);
    head.querySelector(".gcount").textContent = g.items.length + " поз. / " + gQty + " изд.";
    head.addEventListener("click", () => {
      const all = g.items.every(i => i._sel);
      g.items.forEach(i => i._sel = !all);
      render();
    });
    list.appendChild(head);

    g.items.forEach(x => {
      const li = document.createElement("li");
      li.className = "row" + (x._sel ? " sel" : "");
      li.innerHTML =
        '<input type="checkbox" class="chk">' +
        '<span class="t"><span class="nm"></span></span>' +
        '<span class="qty"></span>' +
        '<span class="ship"><input type="number" min="1" step="1" inputmode="numeric"></span>';
      li.querySelector(".nm").textContent = x.name;
      li.querySelector(".qty").textContent = x.qty;
      const chk = li.querySelector(".chk");
      chk.checked = !!x._sel;
      const inp = li.querySelector(".ship input");
      inp.max = x.qty;
      inp.value = Number.isFinite(x._ship) ? x._ship : "";
      inp.classList.toggle("bad", !shipValid(x));
      RENDER_ORDER.push(x);
      // обычный клик / Ctrl / Cmd — переключает только эту строку (и так было, модификатор не нужен).
      // Shift — выбирает диапазон от последней кликнутой строки до этой (стандартное поведение списков).
      li.addEventListener("click", (e) => {
        if (e.target.closest(".ship")) return;
        if (e.shiftKey && lastClicked && RENDER_ORDER.includes(lastClicked)){
          const from = RENDER_ORDER.indexOf(lastClicked), to = RENDER_ORDER.indexOf(x);
          const [lo, hi] = from < to ? [from, to] : [to, from];
          for (let i = lo; i <= hi; i++) RENDER_ORDER[i]._sel = true;
        } else {
          x._sel = !x._sel;
        }
        lastClicked = x;
        render();
      });
      inp.addEventListener("input", () => {
        x._ship = parseFloat(String(inp.value).replace(",", "."));
        inp.classList.toggle("bad", !shipValid(x));
        refresh();
      });
      list.appendChild(li);
    });
  });

  $("state").style.display = shown.length ? "none" : "block";
  if (!shown.length) $("state").textContent = "Нет изделий по выбранным фильтрам";
  renderChips();
  refresh();
}

const selected = () => ITEMS.filter(x => x._sel);
const sumShip = arr => arr.reduce((s, x) => s + (Number.isFinite(x._ship) ? x._ship : 0), 0);

function refresh(){
  const sel = selected();
  const n = sel.length;
  $("counter").innerHTML = 'Выбрано: <b>' + n + '</b> поз. / <b>' + sumShip(sel) + '</b> изд.';
  $("go").disabled = n === 0 || sel.some(x => !shipValid(x));
  $("clearAll").style.display = n > 0 ? "" : "none";
}

$("toggleAll").addEventListener("click", () => { shownItems().forEach(x => x._sel = true); render(); });
$("clearAll").addEventListener("click", () => { ITEMS.forEach(x => x._sel = false); render(); });

function showMsg(t, kind){ const m=$("msg"); m.textContent=t; m.className="msg "+kind; }

function finishScreen(n){
  $("app").innerHTML =
    '<div class="done"><div class="ic">✅</div><h2>Готово</h2>' +
    '<p>Отгружено позиций: ' + n + '<br>Эту вкладку можно закрыть.</p></div>';
  // окно теперь — обычная вкладка (не popup, открытый скриптом), window.close() браузер не даст —
  // поэтому не пытаемся закрывать автоматически, просто показываем, что вкладку можно закрыть вручную.
}

$("go").addEventListener("click", async () => {
  const sel = selected();
  if (!sel.length) return;
  $("go").disabled = true; $("go").textContent = "Отправка…";

  // Аналитика 4040 через POST /task/{id}/datatags/. Поле 18098 (Task) — id задачи-изделия
  // напрямую, справочник 7090 в этой цепочке не участвует.
  const body = {
    dataTag: { id: CONFIG.WRITE_DATATAG_ID },
    items: sel.map(x => {
      const fields = [
        { field: { id: CONFIG.DT_ITEM_TASK }, value: { id: x.taskId } },
        { field: { id: CONFIG.DT_SHIPPED },   value: x._ship }
      ];
      if (x.dealId !== "none") fields.push({ field: { id: CONFIG.DT_DEAL }, value: { id: Number(x.dealId) } });
      return { customFieldData: fields };
    })
  };

  try{
    const d = await api(`/task/${encodeURIComponent(taskId)}/datatags/`, body);
    if (d.result !== "success") throw new Error(d.error || "ошибка отправки");
    // затираем прежние записи 4040 на этой задаче
    await Promise.all(existingEntryKeys.map(k =>
      fetch(CONFIG.BASE + `/datatag/entry/${k}`, { method: "DELETE", headers: { "Authorization": "Bearer " + CONFIG.TOKEN } })
        .then(r => r.json().catch(() => ({})))
    ));
    existingEntryKeys = [];
    finishScreen(sel.length);
  }catch(err){
    showMsg("Не удалось отправить в Planfix: " + err.message, "err");
    $("go").disabled = false; $("go").textContent = "Готово";
    reportError("отправка («Готово»)", err);
  }
});

// старт
(async () => {
  const __t0 = performance.now();
  try{
    if (!forcedStore){ $("state").textContent = "Не указано место (?store=) — для этого источника обязательно"; return; }
    const locId = await resolveLocationId(forcedStore);
    if (!locId){ $("state").textContent = "Место не найдено: " + forcedStore; return; }

    const [entries, existing] = await Promise.all([
      loadMovementForLocation(locId),
      loadExistingRaw()
    ]);
    setHeader(existing.taskName);

    ITEMS = aggregate(entries);
    // пред-отметка: сопоставляем уже добавленные записи 4040 с текущими строками.
    // Приоритет: точное совпадение (задача + сделка) -> совпадение по задаче и количеству -> первая попавшаяся с этой задачей.
    existing.rows.forEach(r => {
      const candidates = ITEMS.filter(x => x.taskId === r.taskId);
      const it = candidates.find(x => x.dealId === r.dealId)
              || candidates.find(x => x.qty === r.ship)
              || candidates[0];
      if (it){ it._sel = true; it._ship = r.ship; }
    });
    buildDealFilter(ITEMS.map(x => ({ id: x.dealId, name: x.dealName })));
    $("msDeal").style.display = "flex";
    $("toolbar").style.display = "flex";
    $("colhead").style.display = "flex";
    if (!ITEMS.length){ $("state").textContent = "Нет изделий в наличии по этому месту"; }
    render();
    $("perf").textContent = "Записей движения: " + entries.length + " · изделий: " + ITEMS.length + " · загрузка: " + Math.round(performance.now()-__t0) + " мс";
  }catch(err){
    $("state").textContent = "Ошибка загрузки: " + err.message;
    reportError("загрузка формы", err);
  }
})();
</script>
