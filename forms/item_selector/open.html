<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Отгрузка изделий — запуск</title>
<style>
  :root{ --bg:#f4f6fb; --card:#fff; --ink:#1a2233; --muted:#6b7686; --line:#e4e8f0; --accent:#3a6df0; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#12151c; --card:#1b1f28; --ink:#e8ecf3; --muted:#98a2b3; --line:#2a303c; --accent:#5b86f5; }
  }
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:24px}
  .card{background:var(--card);max-width:420px;width:100%;border-radius:16px;
    border:1px solid var(--line);box-shadow:0 10px 40px rgba(20,30,60,.10);padding:28px;text-align:center}
  h1{font-size:19px;margin:0 0 6px}
  p{color:var(--muted);margin:0 0 20px;font-size:14px}
  a.btn{display:block;text-decoration:none;border:none;border-radius:12px;padding:14px 22px;background:var(--accent);color:#fff;
    font-size:16px;font-weight:600;cursor:pointer;width:100%}
  a.btn:active{transform:scale(.99)}
</style>
</head>
<body>
<div class="card">
  <h1>Отгрузка изделий</h1>
  <p id="sub">Открываем форму отбора…</p>
  <a class="btn" id="go" href="#">Открыть форму отбора</a>
</div>

<script>
  // Открывает форму отбора В ЭТОЙ ЖЕ вкладке (раньше — во всплывающем окне поверх;
  // по опыту использования вкладка удобнее — не блокируется popup-блокировщиком браузера,
  // не плодит лишние окна).
  const APP = "products_demo.html";

  // Параметры из URL пробрасываются как есть (task, store, ...).
  // пример: open.html?task=28775&store=1
  const params = new URLSearchParams(location.search);
  const taskId = params.get("task") || "";

  if (taskId) document.getElementById("sub").textContent = "Задача №" + taskId + " — открываем форму отбора…";

  // уникальный параметр _ отключает кэш, чтобы всегда грузилась свежая версия формы
  const bust = (location.search ? "&" : "?") + "_=" + Date.now();
  const target = APP + location.search + bust;
  document.getElementById("go").href = target;

  // переходим сразу, без клика; replace — чтобы кнопка «Назад» не возвращала на эту промежуточную страницу
  location.replace(target);
</script>
</body>
</html>
